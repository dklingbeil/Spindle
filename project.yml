name: Spindle
options:
  deploymentTarget:
    macOS: "14.0"
targets:
  Spindle:
    type: application
    platform: macOS
    sources: [Sources]
    info:
      path: Support/Info.plist
      properties:
        CFBundleDisplayName: Spindle
        CFBundleShortVersionString: "1.0.1"
        CFBundleVersion: "2"
        LSUIElement: true
        LSApplicationCategoryType: public.app-category.music
        NSAppleEventsUsageDescription: Spindle controls playback in Spotify and Apple Music when you use the turntable.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.dklingbeil.spindle
        SWIFT_VERSION: "5.0"
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"
        ENABLE_HARDENED_RUNTIME: NO
